<div class="login-wrapper">
  <div class="login-card shadow-5">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary mb-1">Marmitech</h2>
      <p class="text-muted small">Entre com seu e-mail e senha para acessar</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()">
      <div class="mb-4">
        <mdb-form-control>
          <input
            mdbInput
            type="email"
            id="loginEmail"
            name="email"
            class="form-control"
            [(ngModel)]="loginData.email"
            required
          />
          <label mdbLabel class="form-label" for="loginEmail">E-mail</label>
        </mdb-form-control>
      </div>

      <div class="mb-4">
        <mdb-form-control>
          <input
            mdbInput
            type="password"
            id="loginSenha"
            name="senha"
            class="form-control"
            [(ngModel)]="loginData.senha"
            required
          />
          <label mdbLabel class="form-label" for="loginSenha">Senha</label>
        </mdb-form-control>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block btn-rounded py-2 shadow-2"
        [disabled]="!loginForm.valid"
      >
        Entrar
      </button>
    </form>
  </div>
</div>
